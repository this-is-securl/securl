name: Publish SecURL Package

on:
  workflow_dispatch:
  push:
    tags:
      - "securl-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup npm 12 security defaults and trusted publishing
        run: npm install --global npm@12.0.1

      - name: Verify exact release tag and publish commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          git fetch origin main:refs/remotes/origin/main

          PACKAGE_VERSION="$(node --input-type=commonjs --eval \
            'process.stdout.write(require("./packages/core/package.json").version)')"
          RELEASE_TAG="securl-v${PACKAGE_VERSION}"

          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          PUBLISH_SHA="$(git rev-parse 'HEAD^{commit}')"
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"

          test "$PUBLISH_SHA" = "$GITHUB_SHA"
          test "$TAG_SHA" = "$PUBLISH_SHA"
          git merge-base --is-ancestor "$PUBLISH_SHA" refs/remotes/origin/main

          if [ "$EVENT_NAME" = "push" ]; then
            test "$EVENT_REF" = "refs/tags/${RELEASE_TAG}"
          fi

          echo "Verified ${RELEASE_TAG} -> ${PUBLISH_SHA}"

      - name: Install dependencies
        run: npm ci

      - name: Run full package release gate
        run: npm run release:package:check

      - name: Publish SecURL package
        run: npm publish ./packages/core --access public --provenance
