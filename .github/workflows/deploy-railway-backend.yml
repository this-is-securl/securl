name: Deploy Railway Backend

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["SecURL Package Checks"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway token availability
        id: token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN is not configured; skipping Railway deploy."
          fi

      - name: Checkout
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        if: steps.token.outputs.available == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.token.outputs.available == 'true'
        run: npm ci

      - name: Install pinned Railway CLI
        if: steps.token.outputs.available == 'true'
        env:
          RAILWAY_CLI_VERSION: "5.30.1"
          RAILWAY_CLI_SHA256: "c6169e27e87d95d73fb7a30ec2c6b6c767c042f8a3ba9aa98c92deccda8db10c"
        run: |
          set -euo pipefail

          CLI_DIR="${RUNNER_TEMP}/railway-cli"
          CLI_ARCHIVE="${RUNNER_TEMP}/railway-cli.tar.gz"
          CLI_URL="https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"

          mkdir -p "$CLI_DIR"
          curl --fail --location --silent --show-error "$CLI_URL" --output "$CLI_ARCHIVE"
          echo "${RAILWAY_CLI_SHA256}  ${CLI_ARCHIVE}" | sha256sum --check -
          tar -xzf "$CLI_ARCHIVE" -C "$CLI_DIR"
          chmod 0755 "$CLI_DIR/railway"

          echo "$CLI_DIR" >> "$GITHUB_PATH"
          "$CLI_DIR/railway" --version

      - name: Deploy and smoke-check Railway backend
        if: steps.token.outputs.available == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: npm run deploy:railway -- --message "Deploy SecURL backend ${GITHUB_SHA::7}"
